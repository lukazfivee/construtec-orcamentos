name: Publicar OCR Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/ocr-worker/**'
      - '.github/workflows/deploy-ocr-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ocr-production
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cloudflare/ocr-worker
    steps:
      - name: Baixar código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Instalar Wrangler
        run: npm install --no-save wrangler@4.127.1

      - name: Publicar Worker OCR
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
