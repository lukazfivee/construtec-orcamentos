name: Auditoria de segurança

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependências npm
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Bloquear vulnerabilidades de produção
        run: npm run security:audit:prod

      - name: Relatar vulnerabilidades de build/dev
        continue-on-error: true
        run: npm run security:audit

  secret-patterns:
    name: Padrões de segredo e APIs perigosas
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verificar padrões sensíveis
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(api[_-]?key|secret|password|token)\s*[:=]\s*["'\''][^"'\'']{12,}|dangerouslySetInnerHTML|eval\(|new Function|shell\.openExternal' \
            --exclude-dir=.git \
            --exclude=package-lock.json \
            --exclude=security-audit.yml \
            --exclude-dir=node_modules \
            --exclude-dir=skills \
            --exclude=setup-cloud-admin.ts \
            --exclude=postgres-critical.test.ts \
            --exclude=cloud-runtime.test.ts \
            --exclude=main.ts \
            --exclude=CODEX_HANDOFF-ARQUIVO-01.md \
            .; then
            echo "::error::Revise os achados acima antes de prosseguir."
            exit 1
          fi
