name: Gerar instalador do Windows

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    name: Validar e gerar instalador
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar TypeScript e ESLint
        run: npm run verify

      - name: Gerar instalador x64
        run: npm run make:windows

      - name: Preparar instalador com nome permanente
        shell: pwsh
        run: Copy-Item 'out/make/squirrel.windows/x64/Construtec-Orcamentos-1.0.1-Setup.exe' 'out/make/squirrel.windows/x64/Construtec-Orcamentos-Setup.exe'

      - name: Publicar artefato de compilação
        uses: actions/upload-artifact@v4
        with:
          name: Construtec-Orcamentos-Windows-x64
          path: |
            out/make/squirrel.windows/x64/*.exe
            out/make/squirrel.windows/x64/*.nupkg
            out/make/squirrel.windows/x64/RELEASES
          if-no-files-found: error
          retention-days: 30

      - name: Publicar EXE para download direto
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'windows-latest'
          $asset = 'out/make/squirrel.windows/x64/Construtec-Orcamentos-Setup.exe'
          gh release view $tag --repo ${{ github.repository }} 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $asset --repo ${{ github.repository }} --target ${{ github.sha }} --title 'Último instalador Windows' --notes 'Instalador mais recente do Construtec Orçamentos para Windows x64.' --latest
          } else {
            gh release upload $tag $asset --repo ${{ github.repository }} --clobber
            gh release edit $tag --repo ${{ github.repository }} --title 'Último instalador Windows' --notes 'Instalador mais recente do Construtec Orçamentos para Windows x64.' --latest
          }